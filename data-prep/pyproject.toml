[project]
name = "glossa-data-prep"
version = "0.1.0"
description = "Data pipeline for glossa — downloads & transforms PHOIBLE, WikiPron, Wikimedia Commons audio into JSON bundles."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "pydantic>=2.5",
    "tqdm>=4.66",
    # wordfreq provides Zipf word frequencies for ~40 languages, used to
    # pick *recognizable* example words for each grapheme↔phoneme pair.
    # See reconcile.best_example_key and issue #1 comment on this.
    "wordfreq>=3.1",
]

[project.scripts]
glossa-data-prep = "glossa_data_prep.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glossa_data_prep"]
